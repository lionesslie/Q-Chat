[package]
name = "q-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "q_chat"
path = "src/main.rs"

[[bin]]
name = "q-chat-server"
path = "src/bin/server.rs"

[[bin]]
name = "q-chat-launcher"
path = "src/bin/launcher.rs"

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-files = "0.6"
actix-ws = "0.3"
actix-rt = "2"
actix-web-actors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
futures-util = "0.3"
bytestring = "1"
actix-multipart = "0.7"
sanitize-filename = "0.6"
mime_guess = "2"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rand = "0.8"
# Desktop window
tao = "0.33"
wry = "0.47"
image = "0.24"
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }

[profile.release]
opt-level = 3
lto = true

[build-dependencies]
winres = "0.1"
